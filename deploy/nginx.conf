# Nginx reverse proxy for the DingTalk GroupBill mock server.
#
# Usage:
#   1. Replace SERVER_NAME with your domain (or IP).
#   2. Replace SSL_CERT / SSL_KEY paths with your real cert paths
#      (Let's Encrypt: /etc/letsencrypt/live/<domain>/fullchain.pem + privkey.pem).
#   3. Copy to /etc/nginx/sites-available/dingtalk-mock and symlink into
#      sites-enabled, then `nginx -t && systemctl reload nginx`.
#   4. Uvicorn listens on 127.0.0.1:18722 (loopback only — Nginx fronts the public).
#
# Key points:
#   - HTTP → HTTPS 301 redirect
#   - /ws and /api/admin/ws upgraded to WebSocket (WSS over TLS)
#   - /docs and /redoc protected by basic auth (optional — remove the two
#     auth_basic lines if you want them public)
#   - Static assets served directly by FastAPI (already mounted at /)

upstream dingtalk_uvicorn {
    server 127.0.0.1:18722 fail_timeout=5s max_fails=3;
    keepalive 32;
}

# Rate-limit zone: 10 req/s per IP on /api/admin/* (protects against abuse).
limit_req_zone $binary_remote_addr zone=admin_api:10m rate=10r/s;

server {
    listen 80;
    server_name SERVER_NAME;  # ← replace with your domain or IP
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name SERVER_NAME;  # ← replace

    # ── TLS ─────────────────────────────────────────────────────────────
    ssl_certificate     /etc/ssl/certs/dingtalk-mock.pem;       # ← replace
    ssl_certificate_key /etc/ssl/private/dingtalk-mock.key;    # ← replace
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling         on;
    ssl_stapling_verify  on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Client body size (alipay.upload payUrl can be large) ──────────
    client_max_body_size 64k;

    # ── WebSocket endpoints (/ws + /api/admin/ws) ────────────────────
    location ~ ^/(ws|api/admin/ws)$ {
        proxy_pass http://dingtalk_uvicorn;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;  # keep idle WS open for 1h
        proxy_send_timeout 3600s;
    }

    # ── APK device upload (no API key, but rate-limited) ─────────────
    location /api/device/ {
        limit_req zone=admin_api burst=20 nodelay;
        proxy_pass http://dingtalk_uvicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── Health check (open, no auth) ──────────────────────────────────
    location = /health {
        proxy_pass http://dingtalk_uvicorn;
        access_log off;
    }

    # ── API docs (basic auth — change or remove) ─────────────────────
    location ~ ^/(docs|redoc|openapi\.json)$ {
        auth_basic           "DingTalk Mock API Docs";
        auth_basic_user_file /etc/nginx/.htpasswd-dingtalk;  # ← create with htpasswd
        proxy_pass http://dingtalk_uvicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── All admin APIs (require X-API-Key from app, plus rate-limit) ──
    location /api/admin/ {
        limit_req zone=admin_api burst=20 nodelay;
        proxy_pass http://dingtalk_uvicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── /debug/ws/send (admin, treat like /api/admin/) ───────────────
    location /debug/ {
        limit_req zone=admin_api burst=20 nodelay;
        proxy_pass http://dingtalk_uvicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Static frontend + everything else (catch-all) ─────────────────
    location / {
        proxy_pass http://dingtalk_uvicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── Access / error logs ───────────────────────────────────────────
    access_log /var/log/nginx/dingtalk-mock.access.log;
    error_log  /var/log/nginx/dingtalk-mock.error.log warn;
}
